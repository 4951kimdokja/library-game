<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1,000권의 서재</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="start-screen" class="screen active">
        <div class="start-container">
            <h1>📚 1,000권의 서재</h1>
            <p>뒤죽박죽 섞인 1,000권의 책을 제자리에 정리하는 힐링 퍼즐</p>
            <button class="start-btn" onclick="startGame()">책 정리 시작</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <h1>📚 1,000권의 서재</h1>
        
        <div class="inventory-section">
            <div>내 소지품 (최대 5권)</div>
            <div class="inventory" id="inventory-slots"></div>
        </div>

        <!-- 책장 영역 -->
        <div id="shelf-area"></div>

        <div class="bottom-nav">
            <button onclick="changeZone(0)">1~250</button>
            <button onclick="changeZone(1)">251~500</button>
            <button onclick="changeZone(2)">501~750</button>
            <button onclick="changeZone(3)">751~1000</button>
        </div>
    </div>

    <div id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modal-title">제목</h3>
            <p id="modal-desc">내용</p>
            <button onclick="closeModal()">닫기</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
